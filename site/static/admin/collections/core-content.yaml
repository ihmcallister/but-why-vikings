collections:
  - name: core_content
    label: Core content
    files:
      - name: homepage
        label: Homepage
        file: site/content/_index.md
        fields:
          - label: Title
            name: title
            widget: string
          - label: Body
            name: body
            widget: markdown
          - label: Paige settings
            name: paige
            widget: object
            required: false
            fields:
              - label: Display settings
                name: pages
                widget: object
                required: false
                fields:
                  - name: disable_collections
                    widget: hidden
                    default: true
                  - name: disable_pages
                    widget: hidden
                    default: true
                  - name: disable_sections
                    widget: hidden
                    default: true
                  - name: disable_title
                    widget: hidden
                    default: true