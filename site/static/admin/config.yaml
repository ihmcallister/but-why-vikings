# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ihmcallister/but-why-vikings
  branch: main
  site_domain: butwhyvikings.netlify.app
  squash_merges: true
publish_mode: editorial_workflow
site_url: https://butwhyvikings.netlify.app/
media_folder: site/static/img
public_folder: img
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        width: 800
        height: 800
collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    extension: "md"
    format: "yaml"
    create: true
    # Tells Sveltia to create a leaf bundle folder structure: /content/posts/my-post/index.md
    path: "site/static/img/"
    # Saves uploaded images directly into the same sub-folder
    media_folder: "site/static/img"
    public_folder: "site/static/img"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }
