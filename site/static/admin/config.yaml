# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ihmcallister/but-why-vikings
  branch: main
  site_domain: butwhyvikings.netlify.app
  squash_merges: true
publish_mode: editorial_workflow
site_url: https://butwhyvikings.netlify.app/
media_folder: site/static/img

collections:
  - name: core_content
    label: Core content
    files:
      - name: homepage
        label: Homepage
        file: site/content/_index.md
        fields:
          - label: Title
            name: title
            widget: string
          - label: Body
            name: body
            widget: markdown
          - label: Paige settings
            name: paige
            widget: object
            required: false
            fields:
              - label: Display settings
                name: pages
                widget: object
                required: false
                fields:
                  - name: disable_collections
                    widget: hidden
                    default: true
                  - name: disable_pages
                    widget: hidden
                    default: true
                  - name: disable_sections
                    widget: hidden
                    default: true
                  - name: disable_title
                    widget: hidden
                    default: true
  - name: pages
    label: Pages
    folder: site/content
    create: true
    extension: md
    format: frontmatter
    path: "{{slug}}/_index"
    fields:
      - label: Title
        name: title
        widget: string
      - name: type
        widget: hidden
        default: page
      - label: Body
        name: body
        widget: markdown
  - name: hosts
    label: Hosts
    folder: site/content/hosts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Weight
        name: weight
        widget: number
        default: 1
      - name: type
        widget: hidden
        default: host
      - label: Body
        name: body
        widget: markdown
